<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Downloader Professional</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <!-- ===== HEADER ===== -->
      <div class="header">
        <div class="header-title">Media Downloader Professional</div>
      </div>

      <!-- ===== TABS NAVIGATION ===== -->
      <div class="tabs-container">
        <div class="tabs">
          <button class="tab-btn active" data-tab="detected">Detected Media</button>
          <button class="tab-btn" data-tab="saved">Saved Media</button>
        </div>
      </div>

      <!-- ===== DETECTED MEDIA TAB ===== -->
      <div class="tab-content active" data-tab="detected">
        <!-- Multi-Filter Bar -->
        <div class="filter-bar">
          <div class="filter-chips">
            <div class="filter-chip" data-category="videos" data-section="detected">
              <button class="chip-btn" data-category="videos" data-section="detected">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z" /><rect x="3" y="6" width="12" height="12" rx="2" stroke-width="2" /></svg>
                Videos
                <span class="chip-count" data-category="videos" data-section="detected">0</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-arrow"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
              </button>
              <div class="chip-dropdown" data-category="videos" data-section="detected">
                <!-- Video sub-type checkboxes populated dynamically -->
              </div>
            </div>
            <div class="filter-chip" data-category="images" data-section="detected">
              <button class="chip-btn" data-category="images" data-section="detected">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                Images
                <span class="chip-count" data-category="images" data-section="detected">0</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-arrow"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
              </button>
              <div class="chip-dropdown" data-category="images" data-section="detected">
                <!-- Image sub-type checkboxes populated dynamically -->
              </div>
            </div>
            <div class="filter-chip" data-category="audio" data-section="detected">
              <button class="chip-btn" data-category="audio" data-section="detected">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>
                Audio
                <span class="chip-count" data-category="audio" data-section="detected">0</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-arrow"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
              </button>
              <div class="chip-dropdown" data-category="audio" data-section="detected">
                <!-- Audio sub-type checkboxes populated dynamically -->
              </div>
            </div>
          </div>
          <button class="reset-btn" id="resetFiltersBtn" title="Reset all filters">Reset</button>
        </div>

        <!-- Sort Bar -->
        <div class="sort-bar">
          <label class="sort-label" for="sortSelect">Sort:</label>
          <select class="sort-select" id="sortSelect">
            <option value="date_desc">Newest first</option>
            <option value="date_asc">Oldest first</option>
            <option value="size_desc">Largest first</option>
            <option value="size_asc">Smallest first</option>
            <option value="type_asc">Type A-Z</option>
            <option value="type_desc">Type Z-A</option>
          </select>
        </div>

        <!-- Media Content -->
        <div class="content" id="content">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
              </svg>
            </div>
            <div>No media detected on this page.</div>
            <div style="margin-top: 8px; font-size: 12px">Browse the page to detect media automatically.</div>
          </div>

          <ul class="media-list" id="mediaList" style="display: none">
            <!-- Media items will be populated here dynamically -->
          </ul>
        </div>

        <!-- Footer Actions -->
        <div class="footer">
          <div>
            <span id="mediaCount">0 medias</span>
          </div>
          <div class="footer-actions">
            <button class="footer-btn danger" id="clearAllBtn">Clear All</button>
            <button class="footer-btn" id="showInPageBtn">Show in page</button>
            <div class="tooltip">
              <button class="footer-btn" id="refreshBtn">Refresh</button>
              <span class="tooltip-text">Scan page again for media</span>
            </div>
          </div>
        </div>
      </div>

      <!-- ===== SAVED MEDIA TAB ===== -->
      <div class="tab-content" data-tab="saved">
        <!-- Saved Media Filter Bar -->
        <div class="filter-bar saved-filter-bar">
          <div class="filter-chips">
            <div class="filter-chip" data-category="videos" data-section="saved">
              <button class="chip-btn" data-category="videos" data-section="saved">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14v-4z" /><rect x="3" y="6" width="12" height="12" rx="2" stroke-width="2" /></svg>
                Videos
                <span class="chip-count" data-category="videos" data-section="saved">0</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-arrow"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
              </button>
              <div class="chip-dropdown" data-category="videos" data-section="saved">
                <!-- Video sub-type checkboxes populated dynamically -->
              </div>
            </div>
            <div class="filter-chip" data-category="images" data-section="saved">
              <button class="chip-btn" data-category="images" data-section="saved">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                Images
                <span class="chip-count" data-category="images" data-section="saved">0</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-arrow"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
              </button>
              <div class="chip-dropdown" data-category="images" data-section="saved">
                <!-- Image sub-type checkboxes populated dynamically -->
              </div>
            </div>
            <div class="filter-chip" data-category="audio" data-section="saved">
              <button class="chip-btn" data-category="audio" data-section="saved">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" /></svg>
                Audio
                <span class="chip-count" data-category="audio" data-section="saved">0</span>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="chip-arrow"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
              </button>
              <div class="chip-dropdown" data-category="audio" data-section="saved">
                <!-- Audio sub-type checkboxes populated dynamically -->
              </div>
            </div>
          </div>
          <button class="reset-btn" id="savedResetFiltersBtn" title="Reset all filters">Reset</button>
        </div>

        <!-- Saved Media Sort Bar -->
        <div class="sort-bar">
          <label class="sort-label" for="savedSortSelect">Sort:</label>
          <select class="sort-select" id="savedSortSelect">
            <option value="date_desc">Newest first</option>
            <option value="date_asc">Oldest first</option>
            <option value="size_desc">Largest first</option>
            <option value="size_asc">Smallest first</option>
            <option value="type_asc">Type A-Z</option>
            <option value="type_desc">Type Z-A</option>
          </select>
        </div>

        <div class="saved-media-content">
          <div class="empty-state" id="savedEmptyState">
            <div class="empty-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                />
              </svg>
            </div>
            <div>No saved media yet.</div>
            <div style="margin-top: 8px; font-size: 12px">Use the save button to save media for later.</div>
          </div>

          <ul class="media-list" id="savedMediaList" style="display: none">
            <!-- Saved media items will be populated here dynamically -->
          </ul>
        </div>

        <!-- Footer Actions -->
        <div class="footer">
          <div>
            <span id="savedMediaCount">0 saved</span>
          </div>
          <div class="footer-actions">
            <button class="footer-btn danger" id="clearSavedBtn">Clear All</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== MODALS ===== -->
    <!-- Modal for entering custom filename -->
    <div class="save-modal" id="saveModal">
      <div class="save-modal-content">
        <h3>Save Media</h3>
        <div class="save-modal-url" id="saveModalUrl"></div>
        <div class="form-group">
          <label for="customFilename">Filename:</label>
          <input type="text" id="customFilename" class="filename-input" placeholder="Enter custom filename" />
        </div>
        <div class="save-modal-actions">
          <button id="cancelSaveBtn" class="modal-btn cancel-btn">Cancel</button>
          <button id="confirmSaveBtn" class="modal-btn save-btn">Save</button>
        </div>
      </div>
    </div>

    <!-- Modal for media preview/playback -->
    <div class="preview-modal" id="previewModal">
      <div class="preview-modal-content">
        <div class="preview-header">
          <h3 id="previewTitle">Media Preview</h3>
          <button class="preview-close-btn" id="previewCloseBtn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
          </button>
        </div>
        <div class="preview-body" id="previewBody">
          <!-- Video/Audio/Image element will be injected here -->
        </div>
        <div class="preview-footer">
          <a class="preview-open-link" id="previewOpenLink" href="#" target="_blank">Open in new tab</a>
        </div>
      </div>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
